services:
  # Database Service (MySQL 8.0)
  mysql:
    image: mysql:8.0
    container_name: waste-management-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # NestJS Application API Service (Development Hot-Reload Enabled)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waste-management-api
    restart: always
    command: npm run start:dev
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://root:root%401234@mysql:3306/waste_management
      DATABASE_READ_URL: mysql://root:root%401234@mysql:3306/waste_management
      CENTRAL_CORE_DATABASE_URL: mysql://root:root%401234@mysql:3306/central_core_db
      CENTRAL_CORE_DATABASE_READ_URL: mysql://root:root%401234@mysql:3306/central_core_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${PORT:-7001}:${PORT:-7001}'
    volumes:
      - ./src:/usr/src/app/src
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
      - ./tsconfig.build.json:/usr/src/app/tsconfig.build.json
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: waste-management-redis
    restart: always
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  redis_data:
